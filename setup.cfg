[metadata]
name = mixed-pilot-harness
version = 0.1.0
description = A small, provider-neutral turn harness for the mixed-pilot benchmark.

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    tomli>=1.1.0; python_version < "3.11"

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    mixed-pilot = mixed_pilot_harness.cli:main
    mixed-pilot-collect = mixed_pilot_harness.collection.cli:main
    mixed-pilot-infer = mixed_pilot_harness.inference.cli:main
    mixed-pilot-collect-steps = mixed_pilot_harness.step_collection.cli:main

[options.package_data]
mixed_pilot_harness.collection.upstream = *.yaml, *.json, *.md
mixed_pilot_harness.inference = docker_runtime/*.cjs

[options.extras_require]
swebench =
    swebench==4.1.0
    datasets>=2.18,<5
collection =
    PyYAML>=6.0
    Jinja2>=3.1
scienceworld =
    PyYAML>=6.0
    Jinja2>=3.1
    scienceworld==1.2.3
hle =
    datasets>=2.18,<5
virtualworld =
    PyYAML>=6.0
    Jinja2>=3.1
    scienceworld==1.2.3
    alfworld==0.4.2
    textworld[pddl]==1.7.0
    fast-downward-textworld==20.6.4
router =
    joblib>=1.3
    lightgbm>=4.0
    numpy>=1.24
    onnxruntime>=1.16
    PyYAML>=6.0
    scikit-learn>=1.3
