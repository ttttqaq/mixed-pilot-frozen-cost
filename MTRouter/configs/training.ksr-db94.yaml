# DB94: data/step-KSR-brunch-1/training/samples.jsonl.
# Keep the generic training defaults unchanged; this file selects this run's pool.
model_pool:
  - "qwen-flash-2025-07-28"
  - "glm-5.3"

history_encoder:
  model_name: "/DB/data/yujietang/huggingface_models/Qwen3-Embedding-0.6B"
  freeze_encoder: true
  max_tokens: 8192
  min_recent_turns: 1
  pooling_mode: "last_token"
  backend: "hf"

training:
  epochs: 100
  batch_size: 64
  device: "auto"
  learning_rate: 1.0e-3
  lambda_: 0.0
  cost_loss_weight: 0.0
  optimizer: "adamw"
  weight_decay: 0.01
  grad_clip: 1.0
  scheduler: "cosine"
  min_lr: 1.0e-5
  early_stop: 0
  val_ratio: 0.1
  save_every: 5
  max_checkpoints: 5
  awr:
    enabled: false
  margin:
    enabled: false
    weight: 0.1

model_encoder:
  custom_models_path: "/DB/data/yujietang/Agent/code/mixed-pilot/MTRouter/configs/models.ksr-db94.yaml"
  meta_embed_dim: 32
  residual_embed_dim: 16
  residual_l2_weight: 0.001
  output_dim: 64

q_network:
  hidden_dims: [256, 256]
  dropout: 0.1

precompute:
  enabled: true
  # FP32 + 8192-token histories: use one history per batch on a 24-GiB RTX 3090.
  batch_size: 1
  backend: "hf"

# Online validation uses paid model APIs. CLI --eval-* arguments override these values.
# Set dataset to null to disable it. This section is ignored by embedding precomputation.
online_evaluation:
  dataset: "/DB/data/yujietang/Agent/code/mixed-pilot/data/VirtualWorld-20"
  every_steps: 3500
  split: "test"
  step_limit: 50
  timeout: 7200
  harness_config: "/DB/data/yujietang/Agent/code/mixed-pilot/harness.json"
  pricing: "/DB/data/yujietang/Agent/code/mixed-pilot/configs/inference.prices.json"
  python: "/DB/rhome/yujietang/miniconda3/envs/mixed-pilot/bin/python"
  # null means use the trained model pool in the same order.
  model_profiles: null
